version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-trade-db
    environment:
      POSTGRES_USER: smart_trade
      POSTGRES_PASSWORD: smart_trade_password
      POSTGRES_DB: smart_trade_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_trade"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-trade-network

  # REST API Service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart-trade-api
    environment:
      DATABASE_URL: postgresql://smart_trade:smart_trade_password@postgres:5432/smart_trade_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DEBUG: "false"
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BROKER_API_KEY: your_broker_api_key
      BROKER_API_SECRET: your_broker_api_secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - smart-trade-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Worker Service (Background Jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart-trade-worker
    environment:
      DATABASE_URL: postgresql://smart_trade:smart_trade_password@postgres:5432/smart_trade_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BROKER_API_KEY: your_broker_api_key
      BROKER_API_SECRET: your_broker_api_secret
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - .:/app
    networks:
      - smart-trade-network
    command: python worker_service.py

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-trade-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      REACT_APP_WS_URL: ws://localhost:8000/api/ws
      REACT_APP_ENVIRONMENT: development
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - smart-trade-network
    stdin_open: true
    tty: true

  # Kafka (Message Broker)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: smart-trade-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    networks:
      - smart-trade-network

  # Zookeeper (Kafka dependency)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: smart-trade-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smart-trade-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: smart-trade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-trade-network

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smart-trade-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-trade
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - smart-trade-network

volumes:
  postgres_data:
  redis_data:

networks:
  smart-trade-network:
    driver: bridge
